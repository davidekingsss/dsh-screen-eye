# Market submission for awesome-dsh-plugin.
#
# The contributing guide requires the target repo to be at least 1 day old
# (checked automatically by CI), so this file is staged here and the PR is
# opened the day after the repository was created.
#
# Open a PR against https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
# adding exactly one file, named after the repo at:
#
#   data/plugins/davidekingsss__dsh-screen-eye.yml
#
# Contents of that file:
#
# ---------------------------------------------------------------------------
url: https://github.com/davidekingsss/dsh-screen-eye
name: davidekingsss/dsh-screen-eye
category: vision
description:
  # Quoted because the line contains ": " — unquoted, YAML reads it as a
  # nested key and the submission fails to parse.
  en: 'macOS screen capture for the agent: one tool captures the screen and returns the image itself, and a second tool reports whether Screen Recording is granted and opens the exact settings pane when it is not.'
  zh: '面向 agent 的 macOS 截屏：一个工具截屏并把图片本身返回给模型，另一个工具报告屏幕录制授权状态，未授权时直接打开对应的系统设置面板。'
# ---------------------------------------------------------------------------
#
# Claims in the description, and where each is verifiable in the repo:
#
#   "one tool captures the screen and returns the image itself"
#       -> index.mjs registers `screenshot`; lib/screenshot-tool.mjs returns a
#          value whose `render` emits an `image` content block
#          (lib/image.mjs `imageContent`).
#   "a second tool reports whether Screen Recording is granted"
#       -> `screen_permission` with action "check";
#          lib/permission.mjs `probeScreenRecording` performs a real capture
#          and classifies the result.
#   "opens the exact settings pane when it is not"
#       -> `screen_permission` with action "open_settings";
#          lib/permission.mjs `openScreenRecordingSettings`.
#   "macOS" (the entry does not claim other platforms)
#       -> cordis.patch.yml `disabled: !!js process.platform !== 'darwin'`,
#          re-checked in index.mjs `apply`.
#
# Checklist from the contributing guide:
#   [x] package.json declares dsh.bundle with a cordis.patch.yml
#   [x] real, working code (52 self-test cases, run with `node test/selftest.mjs`)
#   [x] `dsh-plugin` topic added to the repository
#   [x] description states what the plugin does, no superlatives
#   [x] category matches what the plugin does
#   [ ] repository at least 1 day old — this is the only item that cannot be
#       finished early, and it is checked by CI, not by argument. The PR is
#       opened once the repository passes the threshold.
#
# ---------------------------------------------------------------------------
# "Is it already covered?" — the review question this entry has to answer
#
# The list already carries screenshot plugins, so the honest question is what
# this one adds. Checked against the entries themselves rather than assumed:
#
#   paicat1/dsh-screenshot            Windows only; the README states the
#                                     platform and that it calls PowerShell's
#                                     System.Drawing.CopyFromScreen. Its
#                                     agent-facing tool is the closest in
#                                     spirit to this one, on the other platform.
#   deepseekbluefish/dsh-screenshot-  Windows only, and driven from the
#   plugin                            composer UI rather than by the agent.
#   TaurusWood/dsh-plugin-appshot     macOS and Windows, but a global hotkey
#   WongYuYe/dsh-appshots             for a human: the capture lands in the
#                                     composer for the user to send. Neither
#                                     registers a tool the agent can call.
#   Max-Null/dsh-capture              Driven by a hotkey or a composer button;
#                                     in the browser it uses getDisplayMedia,
#                                     which is a per-use consent, not a grant.
#   Junkrat9527/dsh-desktop-          macOS and agent-callable, but a whole
#   automation                        desktop-control suite, and as published
#                                     the npm package cannot work: it reads
#                                     ~/.agents/skills/desktop-automation/
#                                     scripts/bin/desktop-control-server, and
#                                     neither that binary nor the plist it also
#                                     needs is in the tarball or fetched by a
#                                     postinstall step.
#
# What none of them do is the thing this plugin exists for: an agent-callable
# tool on macOS that returns the image itself in the same call, whose
# permission story is handled rather than assumed. The macOS entries either
# need a human at a hotkey or ship a native helper; the agent-callable ones are
# on Windows. This one is a single tool plus the onboarding for the grant that
# tool needs, with no compiled artefact in between.
#
# ---------------------------------------------------------------------------
