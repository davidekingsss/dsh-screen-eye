url: https://github.com/davidekingsss/dsh-screen-eye
name: davidekingsss/dsh-screen-eye
category: vision
description:
  # Quoted because the line contains ": " — unquoted, YAML reads it as a
  # nested key and the submission fails to parse.
  en: 'Agent screen capture on macOS and Windows: one tool captures the screen and returns the image itself, so the model sees it without a second call. On Windows a whole burst runs in one engine call; on macOS a resident helper drops a region capture to 13ms and a change check to 23ms. A second tool, macOS only, reports whether Screen Recording is granted and opens the settings pane that fixes it.'
  zh: 'macOS 与 Windows 上的 agent 截屏：一个工具截屏并把图片本身返回给模型，无需再调第二次。Windows 上整段连拍在同一个引擎进程内完成；macOS 上常驻助手把区域截图降到 13ms、变化检测降到 23ms。另有一个仅 macOS 的工具：报告屏幕录制授权状态，并直接打开用于修复的系统设置面板。'
# ---------------------------------------------------------------------------
#
# Claims in the description, and where each is verifiable in the repo:
#
#   "one tool captures the screen and returns the image itself"
#       -> index.mjs registers `screenshot`; lib/screenshot-tool.mjs returns a
#          value whose `render` emits an `image` content block
#          (lib/image.mjs `imageContent`).
#   "a burst of frames runs in a single engine call"
#       -> lib/platform/win32.mjs `captureBurst`, taken up by
#          lib/capture.mjs `captureFrames`; asserted live by the case that
#          requires a spacing under 700ms, which a per-frame engine cannot meet.
#   "on macOS a second tool reports whether Screen Recording is granted"
#       -> `screen_permission` with action "check";
#          lib/permission.mjs `probeScreenRecording` performs a real capture
#          and classifies the result. Not registered on Windows, which has no
#          grant to report (lib/platform/win32.mjs declares `permission: null`).
#   "opens the exact settings pane when it is not"
#       -> `screen_permission` with action "guide";
#          lib/permission.mjs `openScreenRecordingSettings`.
#   "macOS and Windows" (and nothing else)
#       -> cordis.patch.yml `disabled: !!js process.platform !== 'darwin' &&
#          process.platform !== 'win32'`, re-checked in index.mjs `apply`, with a
#          self-test holding the expression and the engine registry together.
#
# Checklist from the contributing guide:
#   [x] package.json declares dsh.bundle with a cordis.patch.yml
#   [x] real, working code (118 self-test cases, run with `node test/selftest.mjs`
#       on macOS and on Windows)
#   [x] `dsh-plugin` topic added to the repository
#   [x] description states what the plugin does, no superlatives
#   [x] category matches what the plugin does
#   [ ] repository at least 1 day old — this is the only item that cannot be
#       finished early, and it is checked by CI, not by argument. The PR is
#       opened once the repository passes the threshold.
#
# ---------------------------------------------------------------------------
# "Is it already covered?" — the review question this entry has to answer
#
# The list already carries screenshot plugins, so the honest question is what
# this one adds. Checked against the entries themselves rather than assumed:
#
#   paicat1/dsh-screenshot            Windows only; the README states the
#                                     platform and that it calls PowerShell's
#                                     System.Drawing.CopyFromScreen. Its
#                                     agent-facing tool is the closest in
#                                     spirit to this one, on the other platform.
#   deepseekbluefish/dsh-screenshot-  Windows only, and driven from the
#   plugin                            composer UI rather than by the agent.
#   TaurusWood/dsh-plugin-appshot     macOS and Windows, but a global hotkey
#   WongYuYe/dsh-appshots             for a human: the capture lands in the
#                                     composer for the user to send. Neither
#                                     registers a tool the agent can call.
#   Max-Null/dsh-capture              Driven by a hotkey or a composer button;
#                                     in the browser it uses getDisplayMedia,
#                                     which is a per-use consent, not a grant.
#   Junkrat9527/dsh-desktop-          macOS and agent-callable, but a whole
#   automation                        desktop-control suite, and as published
#                                     the npm package cannot work: it reads
#                                     ~/.agents/skills/desktop-automation/
#                                     scripts/bin/desktop-control-server, and
#                                     neither that binary nor the plist it also
#                                     needs is in the tarball or fetched by a
#                                     postinstall step.
#
# What none of them do is the thing this plugin exists for: a tool the agent
# calls by itself, on macOS *and* on Windows, that returns the image itself in
# the same call — with the permission story handled rather than assumed on
# macOS, and with the two Windows-specific ways a capture can succeed and still
# be useless handled rather than shipped. The macOS entries either need a human
# at a hotkey or ship a native helper; the agent-callable ones are Windows-only,
# and reading them is what this port was measured against: a Windows engine that
# ignored DPI awareness captures a downscaled copy of the screen, and one that
# ignores the session captures a black frame and reports success. Both are
# covered here by construction (docs/windows.md, docs/verification.md).
#
# On Windows specifically, this entry adds: a burst taken in one engine process,
# because a PowerShell start per frame would make the advertised interval
# unreachable; the session preflight and the all-black frame report; per-display
# origins in the inventory, without which a region on a second screen is not
# expressible; and one plugin for both platforms instead of one per platform.
#
