# dsh bundle layer: mount dsh-screen-eye.
#
# The platform gate lives here rather than only in `apply()` so that on a
# non-macOS host the module is never even imported — no code runs, no tools
# are registered, nothing to go wrong. `disabled` with a `!!js` expression is
# the mechanism dsh-base itself uses for its own platform-conditional entries.
# `apply()` still re-checks, so a direct mount that bypasses this patch cannot
# register capture tools on a platform that has no capture engine.
- insert:
    - id: screen-eye
      name: dsh-screen-eye
      disabled: !!js process.platform !== 'darwin'
