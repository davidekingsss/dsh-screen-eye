name: test

# The suite is the project's evidence that the code works, so it runs on every
# push rather than only when someone remembers to run it. Development runs it
# with the harness profile's node_modules on the resolution path; here it is
# installed from the registry instead, which also proves the package is
# self-contained enough to test on a machine that has never seen the harness.
#
# Both platforms the plugin serves are tested, because the point of the seam is
# that one of them can be changed without the other noticing — and that claim is
# only worth anything if something checks the other one afterwards. Each job runs
# the whole suite: the cases that assert a platform's own engine as a pure
# mapping execute everywhere, and the ones that need a real screen skip
# themselves on a hosted runner, which has no interactive desktop.
#
# The versions are pinned exactly and deliberately. These packages publish the
# current line under the `next` dist-tag, and their `latest` tag still points at
# a much older release: an unpinned install silently resolves to the old one and
# the import fails.
#
# The macOS job also compiles the resident helper, because the suite asserts that
# it builds and that the rectangle it is asked for is the one `screencapture` is
# asked for. A runner with no Swift toolchain skips that case rather than
# failing, which is the same degradation the plugin itself performs — so a green
# macOS job with a skip there is worth reading rather than assuming.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node test/selftest.mjs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node test/selftest.mjs
